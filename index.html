<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinePack Pro – نسخه‌ی ماژولار کامل</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="toolbar"></div>
  <div class="content">
    <aside id="sidebar"></aside>
    <main id="stage">
      <canvas id="canvas"></canvas>
      <div id="ghost" class="ghost hide"></div>
      <div id="rotHandle" class="rot-h hide"></div>
      <div id="help" class="help hide"></div>
    </main>
  </div>
  <div id="timeline"></div>

  <!-- SVG symbols -->
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <symbol id="ico-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="ico-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M2 12s4-7 10-7c1.8 0 3.4.6 4.8 1.4M22 12s-4 7-10 7c-1.8 0-3.4-.6-4.8-1.4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="ico-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
